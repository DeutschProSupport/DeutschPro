else if(state.page==='quiz'){const questionId=state.reviewMode?state.reviewIds[state.q]:state.q,x=vocab[questionId],wrong=wrongTranslations[state.lang],opts=[x.translations[state.lang],wrong[questionId],wrong[(questionId+2)%5]],correctIndex=(questionId*2+1)%3;let reordered=[null,null,null];reordered[correctIndex]=opts[0];let rest=opts.slice(1);for(let i=0;i<3;i++)if(reordered[i]===null)reordered[i]=rest.shift();state.correctIndex=correctIndex;h=`<button class="back" onclick="go(state.reviewMode?'mistakes':'lesson')">← ${t(state.reviewMode?'mistakes':'lessons')}</button><div class="between small muted"><b>A1 • ${t('practice')}</b><b>${state.q+1}/${state.reviewMode?state.reviewIds.length:5}</b></div><div class="progress" style="margin:18px 0 30px"><div style="width:${(state.q+1)/(state.reviewMode?state.reviewIds.length:5)*100}%"></div></div><div class="quizTitle">${t('chooseAnswer')}</div><div class="card" style="text-align:center;padding:30px 12px"><div style="font-size:30px;font-weight:900">${safe(x.de)}</div><p class="muted">Deutsch • A1</p></div>${reordered.map((o,i)=>`<button class="option ${state.selected!==null?(i===correctIndex?'correct':state.selected===i?'wrong':''):''}" ${state.selected!==null?'disabled':''} onclick="answer(${i})"><span class="row"><span class="letter">${'ABC'[i]}</span><b>${safe(o)}</b></span><span>${state.selected!==null&&i===correctIndex?'✓':''}</span></button>`).join('')}${state.selected!==null?`<div class="notice ${state.selected===correctIndex?'good':'bad'}">${state.selected===correctIndex?'✓ '+t('correct'):'✕ '+t('wrong')}<div class="small" style="margin-top:7px">✓ ${safe(x.translations[state.lang])}</div></div><button class="primary" onclick="nextQuestion()">${t('next')} →</button>`:''}`}
else if(state.page==='result'){h=`<div class="h1">🎉 ${t('result')}</div><div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:55px">🏆</div><div style="font-size:48px;font-weight:900">${state.score}/${state.reviewMode?state.reviewIds.length:5}</div><div class="muted">${state.reviewMode?t('allFixed'):t('finished')}</div></div><button class="primary" onclick="startQuiz()">${t('again')}</button><button class="secondary" style="width:100%;margin-top:12px" onclick="go('home')">${t('home')}</button>`}
else if(state.page==='profile'){h=`<div class="h1">👤 ${t('profile')}</div><div class="card"><div class="row"><span class="mark">👤</span><div><b>${safe(state.session?.name||state.session?.email||'DeutschPro Learner')}</b><p class="muted small">DeutschPro • A1</p></div></div><p>📘 ${t('completed')}: ${state.done}/5</p><p>🌍 ${languages.find(x=>x[0]===state.lang)?.[2]}</p><button class="secondary" style="width:100%" onclick="go('language')">🌍 ${t('language')}</button><button class="secondary" style="width:100%;margin-top:12px" onclick="go('about')">ℹ️ ${t('about')}</button><button class="secondary" style="width:100%;margin-top:12px" onclick="logout()">${t('logout')}</button></div><p class="note">${t('secureSync')}</p>`}
else if(state.page==='mistakes'){h=`<div class="h1">🧠 ${t('mistakes')}</div><p class="sub">${t('mistakesDesc')}</p><div class="card" style="text-align:center"><div style="font-size:44px">${state.mistakes.length?'📝':'✨'}</div><h2>${state.mistakes.length} ${t('mistakesShort')}</h2><p class="muted">${state.mistakes.length?t('mistakesDesc'):t('noMistakes')}</p>${state.mistakes.length?`<button class="primary" onclick="startMistakeQuiz()">${t('reviewMistakes')} →</button>`:''}</div>${state.mistakes.map(i=>`<div class="lesson"><div><b>${safe(vocab[i].de)}</b><br><small>${safe(vocab[i].translations[state.lang])}</small></div><span class="circleIcon">↻</span></div>`).join('')}`}
else if(state.page==='about'){h=`<button class="back" onclick="go('profile')">← ${t('profile')}</button><div class="hero" style="min-height:205px"><img src="${cityImages.hamburg}" alt="Hamburg" onerror="this.style.display='none'"><div class="heroContent"><span class="pill">DeutschPro • v2.6</span><h2>${t('about')}</h2></div></div><div class="card"><h2>🇩🇪 DeutschPro</h2><p class="sub">${t('aboutText')}</p><p class="muted">${t('aboutVersion')}</p><p><b>${t('developer')}:</b> Muhammad Saidov</p><p><b>${t('contact')}:</b> <a style="color:#a2f0b5;overflow-wrap:anywhere" href="mailto:deutschpro.support@gmail.com">deutschpro.support@gmail.com</a></p></div><div class="card"><h3>🔐 ${t('privacyTitle')}</h3><p class="muted">${t('privacyText')}</p></div><div class="card"><h3>⚖️ ${t('termsTitle')}</h3><p class="muted">${t('termsText')}</p></div><div class="card"><h3>📧 ${t('rightsTitle')}</h3><p class="muted">${t('rightsText')}</p></div>`}
else{h=`<button class="back" onclick="go('home')">← ${t('home')}</button><div class="h1">${t(state.page)}</div><div class="card"><p>${t('lesson')}</p><button class="primary" onclick="go('lesson')">${t('start')} →</button></div>`}
a.innerHTML=h;const bottom=document.getElementById('bottom');bottom.classList.toggle('hide',!state.session||['auth','language'].includes(state.page));bottom.innerHTML=[['⌂','home','home'],['▤','lessons','lesson'],['◈','levels','levels'],['↻','mistakesShort','mistakes'],['♙','profile','profile']].map(x=>`<button class="nav ${state.page===x[2]?'on':''}" onclick="go('${x[2]}')"><i>${x[0]}</i>${t(x[1])}</button>`).join('')}
async function initSupabase(){
 if(client)return client;
 try{
  const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  client=m.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return client;
 }catch(e){notify('Supabase connection error');console.error(e);return null}
}
async function syncProfile(){
 const c=await initSupabase();if(!c||state.session?.type!=='supabase')return;
 const {data:{user},error}=await c.auth.getUser();if(error||!user)return;
 const {error:err}=await c.from('profiles').upsert({id:user.id,display_name:state.session.name||null,interface_language:state.lang||'az'},{onConflict:'id'});
 if(err)console.warn('Profile sync:',err.message);
}
async function syncMistakes(){
 const c=await initSupabase();if(!c||state.session?.type!=='supabase')return;
 const {data:{user}}=await c.auth.getUser();if(!user)return;
 // A simple five-question starter set: keep database in sync with local answers.
 const {data:existing,error}=await c.from('user_mistakes').select('question_id').eq('user_id',user.id);
 if(error){console.warn(error.message);return}
 const desired=new Set(state.mistakes.map(i=>'a1_demo_'+i));
 const toDelete=(existing||[]).map(x=>x.question_id).filter(x=>x.startsWith('a1_demo_')&&!desired.has(x));
 if(toDelete.length)await c.from('user_mistakes').delete().eq('user_id',user.id).in('question_id',toDelete);
 if(desired.size)await c.from('user_mistakes').upsert([...desired].map(question_id=>({user_id:user.id,question_id,updated_at:new Date().toISOString()})),{onConflict:'user_id,question_id'});
}
async function syncProgress(){
 const c=await initSupabase();if(!c||state.session?.type!=='supabase')return;
 const {data:{user}}=await c.auth.getUser();if(!user)return;
 const {error}=await c.from('lesson_progress').upsert({user_id:user.id,lesson_id:'a1_demo_1',completed:state.done===5,best_score:state.done*20,updated_at:new Date().toISOString()},{onConflict:'user_id,lesson_id'});
 if(error)console.warn(error.message);
}
async function loadCloudData(){
 const c=await initSupabase();if(!c||state.session?.type!=='supabase')return;
 const {data:{user}}=await c.auth.getUser();if(!user)return;
 const [p,m,pr]=await Promise.all([
  c.from('profiles').select('interface_language,display_name').eq('id',user.id).maybeSingle(),
  c.from('user_mistakes').select('question_id').eq('user_id',user.id),
  c.from('lesson_progress').select('best_score').eq('user_id',user.id).eq('lesson_id','a1_demo_1').maybeSingle()
 ]);
 if(p.data){if(!state.lang&&p.data.interface_language)state.lang=p.data.interface_language;if(!state.session.name&&p.data.display_name)state.session.name=p.data.display_name}
 if(m.error)console.warn('Mistakes load:',m.error.message);
 else {state.mistakes=(m.data||[]).map(x=>/^a1_demo_[0-4]$/.test(x.question_id)?Number(x.question_id.slice(-1)):-1).filter(x=>x>=0);store(mistakesKey(),state.mistakes)}
 if(pr.error)console.warn('Progress load:',pr.error.message);
 else {state.done=Math.round((pr.data?.best_score||0)/20);store('dp2_done',state.done)}
 render();
}
async function setAuthenticatedSession(user){
 if(!user)return;
 state.session={type:'supabase',email:user.email,name:user.user_metadata?.display_name||''};
 // Only the Supabase SDK session token authorizes access. Local profile cache is not authentication.
 store('dp2_session',state.session);
 state.page=state.lang?'home':'language';render();
 await loadCloudData();await syncProfile();
}
async function submitAuth(e){
 e.preventDefault();const c=await initSupabase();if(!c)return;
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('fullName')?.value.trim()||'';
 const submit=e.target.querySelector('[type=submit]');submit.disabled=true;
 try{
  if(state.mode==='register'){
   const {data,error}=await c.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin.startsWith('http')?location.origin+location.pathname:undefined}});
   if(error)throw error;
   if(!data.session){notify(({az:'E-mailini yoxla və təsdiq linkini aç.',tr:'E-postanı doğrula.',en:'Check your email to confirm your account.',ru:'Подтвердите почту.',ar:'تحقق من بريدك الإلكتروني.',mk:'Потврди ја е-поштата.'})[state.lang]||'Check your email.');return}
   await setAuthenticatedSession(data.user);
  }else{
   const {data,error}=await c.auth.signInWithPassword({email,password});if(error)throw error;
   await setAuthenticatedSession(data.user);
  }
 }catch(err){notify(err.message||'Authentication error')}finally{submit.disabled=false}
}
async function requestPasswordReset(e){
 e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
 try{const c=await initSupabase();if(!c)return;
  const redirectTo=location.protocol.startsWith('http')?location.origin+location.pathname:undefined;
  const {error}=await c.auth.resetPasswordForEmail(document.getElementById('resetEmail').value.trim(),{redirectTo});
  if(error)throw error;notify(rt('sent'));
 }catch(err){notify(err.message||'Unable to send reset email')}finally{btn.disabled=false}
}
async function finishPasswordReset(e){
 e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
 try{const c=await initSupabase();if(!c)return;
  const {error}=await c.auth.updateUser({password:document.getElementById('newPassword').value});
  if(error)throw error;
  await c.auth.signOut();state.session=null;localStorage.removeItem('dp2_session');state.mode='login';state.page='auth';render();notify(rt('updated'));
 }catch(err){notify(err.message||'Unable to update password')}finally{btn.disabled=false}
}
async function logout(){
 if(state.session?.type==='supabase'){const c=await initSupabase();if(c)await c.auth.signOut()}
 state.session=null;state.mistakes=[];state.done=0;localStorage.removeItem('dp2_session');go('auth');
}
function locked(){beep('bad');notify(t('locked'))}function startQuiz(){state.reviewMode=false;state.reviewIds=[];state.q=0;state.selected=null;state.score=0;go('quiz')}function startMistakeQuiz(){if(!state.mistakes.length)return;state.reviewMode=true;state.reviewIds=[...state.mistakes];state.q=0;state.selected=null;state.score=0;go('quiz')}function answer(i){if(state.selected!==null)return;state.selected=i;const id=state.reviewMode?state.reviewIds[state.q]:state.q;if(i===state.correctIndex){state.score++;state.mistakes=state.mistakes.filter(n=>n!==id);beep('good')}else{if(!state.mistakes.includes(id))state.mistakes.push(id);beep('bad')}saveMistakes();render()}function nextQuestion(){beep();if(state.q<(state.reviewMode?state.reviewIds.length:5)-1){state.q++;state.selected=null;render()}else{if(!state.reviewMode){state.done=Math.max(state.done,state.score);store('dp2_done',state.done);if(state.session?.type==='supabase')syncProgress().catch(console.warn)}go('result')}}
async function restoreSession(){
 const c=await initSupabase();
 if(!c){if(state.session?.type==='supabase'){state.session=null;localStorage.removeItem('dp2_session');state.page=state.lang?'auth':'language';render()}return}
 const {data,error}=await c.auth.getSession();
 if(error)console.warn('Session:',error.message);
 if(data?.session?.user){if(state.mode!=='recovery')await setAuthenticatedSession(data.session.user)}
 else if(state.session?.type==='supabase'){
  state.session=null;localStorage.removeItem('dp2_session');state.page=state.lang?'auth':'language';render();
 }
 c.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'&&state.session?.type==='supabase'){
   state.session=null;localStorage.removeItem('dp2_session');state.page='auth';render();
  }
  // Sign-in after an email confirmation redirect.
  if(event==='PASSWORD_RECOVERY'){state.session=null;state.mode='recovery';state.page='auth';render();return}
  if(event==='SIGNED_IN'&&session?.user&&state.session?.type!=='supabase'&&state.mode!=='recovery'){
   setTimeout(()=>setAuthenticatedSession(session.user).catch(console.warn),0);
  }
 });
}
if(location.hash.includes('type=recovery')||location.search.includes('type=recovery'))state.mode='recovery';
localStorage.removeItem('dp2_session');state.page=state.lang?'auth':'language';
render();restoreSession();
</script></body></html>
